<mat-card>
  <h2>Login</h2>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Email</mat-label>
    <input matInput type="email">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label>Password</mat-label>
    <input matInput type="password">

  <button mat-raised-button color="primary" class="full">
    Login
  </button>
</mat-card>
